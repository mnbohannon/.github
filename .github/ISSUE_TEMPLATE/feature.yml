name: Feature or Improvement
description: Propose a new capability or an improvement to existing behavior.
title: "[Feature] "
labels:
  - "type:feature"
  - "state:exploring"
body:
  - type: dropdown
    id: change_type
    attributes:
      label: Change type
      description: Choose the closest classification. The final issue label may be refined during triage.
      options:
        - Feature
        - Improvement
        - Technical Debt
        - Task
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What capability or improvement are you proposing?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Problem / Motivation
      description: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Describe the desired end state without prescribing implementation unless necessary.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What should this request include?

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: Related behavior that is intentionally excluded.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that establish completion.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Screenshots, related issues, constraints, or other useful information.
